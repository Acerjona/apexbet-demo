services:
  - type: web
    name: apexbet
    runtime: node
    plan: free
    buildCommand: npm install && npm run migrate && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: apexbet-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: apexbet-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: apexbet-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: apexbet-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: apexbet-db
          property: password

  - name: apexbet-db
    type: pserv
    plan: free
    databaseName: apexbet
    user: apexbet
